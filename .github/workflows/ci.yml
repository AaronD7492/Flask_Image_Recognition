name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1) pre-commit + pylint
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # if you have dev requirements, install them here too
          pip install pre-commit pylint

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

      - name: Run pylint
        run: |
          # Adjust targets to match what your prof expects
          pylint app.py model.py

  # 2) Unit tests (test_model.py only)
  unit_tests:
    needs: [lint] # <-- only run if lint job passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest is likely in requirements; if not:
          pip install pytest

      - name: Run unit tests (test_model.py)
        run: |
          pytest test_model.py
  # 3) Happy & sad path tests (integration)
  integration_tests:
    needs: [unit_tests] # <-- only run if unit tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration tests (happy + sad)
        run: |
          pytest test_integration_happy.py test_integration_sad.py

  # 4) Acceptance tests
  acceptance_tests:
    needs: [integration_tests] # <-- only run if integration passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run acceptance tests
        run: |
          pytest test_acceptance_happy.py \
                 test_acceptance_sad.py \
                 test_acceptance_edge_cases.py
