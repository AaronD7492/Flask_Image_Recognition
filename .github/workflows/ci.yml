name: Python CI (pre-commit + pytest)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  # 1) pre-commit + pylint
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9" # keep 3.9 to match tensorflow==2.10.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pre-commit pylint

      # Demonstrates the linting (and now blocks the build if it fails)
      - name: Run pre-commit (lint hooks)
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: false

      - name: Run pylint
        run: |
          pylint --exit-zero app.py model.py

  # 2) Unit tests (test_model.py)
  unit_tests:
    needs: [lint] # only run if lint passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          pytest test_model.py

  # 3) Integration tests (happy + sad path)
  integration_tests:
    needs: [unit_tests] # only run if unit tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration tests (happy + sad)
        run: |
          pytest test_integration_happy.py test_integration_sad.py

  # 4) Acceptance tests
  acceptance_tests:
    needs: [integration_tests] # only run if integration passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run acceptance tests
        run: |
          pytest test_acceptance_happy.py \
                 test_acceptance_sad.py \
                 test_acceptance_edge_cases.py

  # 5) Capacity tests with Locust (non-functional)
  capacity_tests:
    needs: [acceptance_tests] # only run if acceptance tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies (project + Locust)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust

      - name: Run Locust capacity test (10 users)
        run: |
          mkdir -p results
          locust -f locustfile.py \
            --headless \
            --users 10 \
            --spawn-rate 1 \
            --run-time 30s \
            --loglevel INFO \
            --csv results/locust_stats

      - name: Upload Locust results
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: results

  # 6) Build and push Docker image (only if acceptance tests pass)
  build_and_push_docker_image:
    needs: [capacity_tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
